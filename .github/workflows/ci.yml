name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.filter.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect docs-only changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1 && git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            files="$(git diff --name-only HEAD^1 HEAD^2)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "${base}" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "${head}")"
            fi

            if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
              echo "run_full=true" >> "${GITHUB_OUTPUT}"
              echo "Unable to resolve diff range; running full CI."
              exit 0
            fi

            files="$(git diff --name-only "${base}" "${head}")"
          fi
          if [[ -z "${files}" ]]; then
            run_full=true
          else
            docs_only=true
            while IFS= read -r file; do
              [[ -z "${file}" ]] && continue
              case "${file}" in
                *.md|*.mdx|docs/**|README|README.*|CHANGELOG|CHANGELOG.*|CONTRIBUTING|CONTRIBUTING.*|LICENSE|LICENSE.*)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac
            done <<< "${files}"

            if [[ "${docs_only}" == "true" ]]; then
              run_full=false
            else
              run_full=true
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"
          echo "run_full=${run_full}"

  docs-only:
    needs: changes
    if: needs.changes.outputs.run_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip expensive CI
        run: echo "Only Markdown/docs files changed; expensive CI jobs skipped."

  preflight:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run preflight validation
        env:
          CHANGESET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:ci:preflight
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  browser:
    name: browser / ${{ matrix.name }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: snapshots
            command: npm run design:snapshots
            results: test-results
          - name: fixtures
            command: npm run smoke:fixtures
            results: test-results/fixtures
          - name: mcp-parity
            command: npm run smoke:mcp-parity
            results: test-results/mcp-parity
          - name: routes-desktop-light
            command: npm run design:routes -- --project=desktop-light
            results: test-results/design-routes
          - name: routes-desktop-dark
            command: npm run design:routes -- --project=desktop-dark
            results: test-results/design-routes
          - name: routes-mobile-light
            command: npm run design:routes -- --project=mobile-light
            results: test-results/design-routes
          - name: routes-mobile-dark
            command: npm run design:routes -- --project=mobile-dark
            results: test-results/design-routes
          - name: routes-sidebar-constrained
            command: npm run design:routes -- --project=sidebar-constrained
            results: test-results/design-routes
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser validation
        run: ${{ matrix.command }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.name }}-failure
          path: ${{ matrix.results }}
          if-no-files-found: ignore
